name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Every Monday 9am UTC

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No continue-on-error: this step must be able to fail. It used to be set,
      # which made the job pass unconditionally -- PR #61's run printed several
      # "Severity: high" findings and the job still concluded success. A check that
      # can't go red isn't evidence of anything. Dependency Audit is not a required
      # status check, so a red run here never blocks a merge; it is a signal.
      #
      # Runs through scripts/audit-allowlist.mjs rather than `npm audit
      # --audit-level=high` directly: the accepted braces finding
      # (GHSA-vfj7-8cjw-p6xm, see FINDINGS_REGISTER.md DEP-1) kept this red on
      # every run regardless of anything else, including two separate NEW
      # findings (source-map-js, sharp) that went unnoticed for a day because a
      # permanently-red check stops getting read. The script fails only on a
      # finding whose advisory ID isn't already an accepted, documented row in
      # FINDINGS_REGISTER.md -- red now means something new. 2026-10-07.
      - name: Audit root dependencies
        run: node scripts/audit-allowlist.mjs --audit-level=high

      # if: always() -- the step above can fail (by design, see its own comment),
      # and a failed step otherwise skips every step after it in the same job.
      # Without this, web/'s audit never ran while root stayed red, so web/'s own
      # findings went unsurfaced in CI (26 vulnerabilities, including moderates
      # with a real fix available -- see DEP-1/DEP-2). Found 2026-10-05.
      - name: Audit web dependencies
        if: always()
        run: cd web && node ../scripts/audit-allowlist.mjs --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
