# --- Standalone receiver/strategy contracts previously outside clarinet check ---
# Found by the Security & Contract Lead (docs/security/CONTRACT_INVENTORY.md D6):
# clarinet check covered 38 of 70 .clar files; the gap included several of these
# that are live on mainnet. Registered so a syntax/type error here fails CI like
# everywhere else. Not registered here: bitflow-arb-compounder.clar, which is
# gitignored as a "stale experiment" and not tracked, so registering it wouldn't work
# for any other checkout; and snp-flashstack-receiver.clar / -v3.clar, which ARE
# tracked now (D7 closed 2026-09-21) as verbatim copies of the deployed gen-1
# contracts, pinned by tests/deployed-source-pins.test.ts. They are immutable and
# already on chain, so a deployed contract has passed the chain's own analysis;
# registering them would add nothing until someone changes them, and they must not
