# ARCHIVED 2026-09-22 — DO NOT APPLY. This is a historical record only.
#
# This is the original gen-1 mainnet publish plan, describing a 13-contract
# publish from SP3TGRVG... at epoch 2.5. Those contracts are long since live
# on mainnet; this file has never been the mechanism that deployed them and
# running it now would attempt to republish already-existing contract names
# (which the chain would reject).
#
# Moved here, out of deployments/, and renamed off "default.mainnet-plan.yaml".
# CORRECTED 2026-09-26 -- twice. First a source-reading pass said this flag
# "auto-selects" the file; a second source-reading pass said a clean checkout
# was one Enter from broadcast. Both were wrong, found by actually RUNNING
# clarinet 3.23.2 (the CI binary) in a network-isolated container, before and
# after this archive, with a mock node recording every broadcast attempt:
#
#   - A clean checkout (no settings/Mainnet.toml) never broadcasts anything,
#     before or after this archive. Recompute fails, falls back to this file,
#     prompts Continue [Y/n]?, exits 0, ZERO requests sent -- before. Exits 1,
#     still zero requests -- after. Neither path was ever a broadcast risk.
#   - This plan could only ever be signed by SP3TGRVG... (any other key
#     panics before signing), and all 13 of its names already exist there, so
#     a real broadcast would have been refused as duplicates regardless.
#
# So archiving this file is hygiene -- it removed a route only the gen-1 key
# could use, one the chain would have refused anyway -- not risk reduction.
#
# The actual, still-live exposure was never this file and this archive does
# not touch it: on any machine with settings/Mainnet.toml, any key, the
# default `apply --mainnet` path (Enter, Enter) reaches the plan clarinet
# computes FRESH from Clarinet.toml -- identical before and after this
# archive (sha256 217564c42bea...). -d is the one place #74 changed anything:
# it panicked before signing pre-#74 (any key but SP3TGRVG...), and since #74
# it reaches that same fresh plan and broadcasts it with no confirmation. At
# the 2026-09-26 measurement, that plan had 57 contract publishes, 26 of them
# from contracts/test/ (28 as of 2026-10-05's merges -- see
# tests/mainnet-plan-guard.test.ts's KNOWN_TEST_PATHS for the live count, not
# this snapshot), including every funds-bearing localized copy (whose
# sbtc-token calls resolve, in that same plan, to the flash-mintable mock
# contracts/sbtc-token.clar) plus test fixtures. 54 of the 57 names were free
# at the current admin principal, including all five undeployed audit-track
# successors. Pinned by tests/mainnet-plan-guard.test.ts (#76).
# See CONTRACT_INVENTORY.md D5 and D6.
#
# Kept, not deleted, as the only record of what this key/era actually
# published — nothing else in the repo documents it.
