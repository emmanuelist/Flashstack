line-a-stx-pool-v3:
  amounts:
    deposit: 50000000            # deploy-testnet.mjs RESERVE_AMOUNT
    honest-receiver-seed: 1000000 # deploy-testnet.mjs RECEIVER_SEED_AMOUNT
    loan: 10000000               # deploy-testnet.mjs step 7 LOAN_AMOUNT; fee = 10000000*5/10000 = 5000
    adversarial-fee-buffer: 1000000
    adversarial-seed-deposit: 5000000
    low-cap-for-limit-test: 5000000
  steps:
    # publish + initial state
    - { id: A1,  signer: K1, deploy: flashstack-stx-pool-v3, fee: 500000,
        verify: "get-admin = K1; get-pending-admin = (ok none); get-stats: paused false, fee 5 bp, max-single-loan u5000000000 (contract defaults :67-69), total-shares u0" }
    - { id: A2,  signer: K1, deploy: stx-pool-v3-test-receiver, fee: 500000 }
    - { id: A3,  signer: K1, deploy: stx-pool-v3-adversarial-receiver, fee: 500000 }
    - { id: A4,  signer: K1, verify-only: "source byte-diff for A1-A3 (see source-verification below) BEFORE any approval" }
    # unapproved receiver is rejected (closes a §6d "not proven" item for this line)
    - { id: A5,  signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-test-receiver", fee: 200000,
        expect: "abort_by_response (err u406) ERR-NOT-APPROVED" }
    # receiver vetting record for the honest receiver is written BEFORE A6 (RECEIVER_VETTING.md §G)
    - { id: A6,  signer: K1, call: "add-approved-receiver K1.stx-pool-v3-test-receiver", fee: 100000,
        verify: "is-approved-receiver = true" }
    - { id: A7,  signer: K1, call: "deposit u50000000", fee: 150000,
        expect: "(ok u50000000000000)  ; 50000000 * (0 + 1e6) / (0 + 1), stx-pool-v3.clar:114" }
    - { id: A8,  signer: K1, stx-transfer: "1000000 -> K1.stx-pool-v3-test-receiver", fee: 10000 }
    - { id: A9,  signer: K1, call: "stx-pool-v3-test-receiver.arm u10000000", fee: 100000 }
    - { id: A10, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-test-receiver", fee: 200000,
        expect: "(ok true); get-pool-balance grows by exactly 5000; receiver balance 1000000 - 5000; get-stats total-loans u1 / total-volume u10000000 / total-fees u5000" }
    # max-single-loan is enforced, then restored
    - { id: A11, signer: K1, call: "set-max-single-loan u5000000", fee: 100000 }
    - { id: A12, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-test-receiver", fee: 200000,
        expect: "abort_by_response (err u404) ERR-EXCEEDS-LIMIT; rejected before the callback, so no arm needed" }
    - { id: A13, signer: K1, call: "set-max-single-loan u5000000000", fee: 100000, verify: "get-stats max-single-loan back to default" }
    # adversarial receiver: the F-9 lock, proven on chain (see §6e for why this is safe to publish)
    - { id: A14, signer: K1, call: "add-approved-receiver K1.stx-pool-v3-adversarial-receiver", fee: 100000,
        note: "deliberate, documented exception to RECEIVER_VETTING item 13; removed again at A26" }
    - { id: A15, signer: K1, stx-transfer: "6000000 -> K1.stx-pool-v3-adversarial-receiver", fee: 10000,
        note: "1 STX fee buffer + 5 STX for seed-deposit" }
    - { id: A16, signer: K1, call: "adversarial.seed-deposit u5000000", fee: 100000,
        expect: "(ok <shares>) credited to the receiver contract; record the share count" }
    - { id: A17, signer: K1, call: "adversarial.arm u1 u10000000", fee: 100000 }
    - { id: A18, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-adversarial-receiver", fee: 200000,
        expect: "abort_by_response (err u411) ERR-REENTRANT — deposit-as-repayment (F-9) blocked; total-shares, receiver shares, pool balance and stats all unchanged vs before A18" }
    - { id: A19, signer: K1, call: "adversarial.arm u2 u10000000", fee: 100000 }
    - { id: A20, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-adversarial-receiver", fee: 200000,
        expect: "abort_by_response (err u411) — withdraw reentry blocked; receiver's seeded shares untouched" }
    - { id: A21, signer: K1, call: "adversarial.arm u3 u10000000", fee: 100000 }
    - { id: A22, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-adversarial-receiver", fee: 200000,
        expect: "abort_by_response (err u402) ERR-REPAY-FAILED — under-repay rejected (closes the §6d under-paying item for this line)" }
    - { id: A23, signer: K1, call: "adversarial.arm u0 u10000000", fee: 100000 }
    - { id: A24, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-adversarial-receiver", fee: 200000,
        expect: "(ok true) — the lock was released after three blocked/reverted loans" }
    - { id: A25, signer: K1, call: "adversarial.exit", fee: 100000,
        expect: "withdraw of the receiver's seeded shares OUTSIDE a loan succeeds (lock is not stuck)" }
    - { id: A26, signer: K1, call: "remove-approved-receiver K1.stx-pool-v3-adversarial-receiver", fee: 100000,
        verify: "is-approved-receiver = false" }
    - { id: A27, signer: K1, call: "adversarial.rescue-stx <full balance>", fee: 100000, verify: "receiver STX balance = 0" }
    # pause: blocks deposit and flash-loan, never withdraw (F-8)
    - { id: A28, signer: K1, call: "set-paused true", fee: 100000 }
    - { id: A29, signer: K1, call: "deposit u1000000", fee: 150000, expect: "abort_by_response (err u405) ERR-PAUSED" }
    - { id: A30, signer: K1, call: "flash-loan u10000000 K1.stx-pool-v3-test-receiver", fee: 200000, expect: "abort_by_response (err u405)" }
    - { id: A31, signer: K1, call: "withdraw <10% of K1's shares>", fee: 100000, expect: "(ok <stx>) — LPs can exit while paused" }
    - { id: A32, signer: K1, call: "set-paused false", fee: 100000 }
    # two-step admin (BC1), same shape as §6b
    - { id: A33, signer: K1, call: "transfer-admin K2", fee: 100000, verify: "get-admin still K1; get-pending-admin = (ok (some K2))" }
    - { id: A34, signer: K1, call: "accept-admin", fee: 100000, expect: "abort_by_response (err u410) ERR-NOT-PENDING-ADMIN; get-admin still K1" }
    - { id: A35, signer: K2, call: "accept-admin", fee: 100000, verify: "get-admin = K2; get-pending-admin = none" }
    - { id: A36, signer: K2, call: "transfer-admin K1", fee: 100000 }
    - { id: A37, signer: K1, call: "accept-admin", fee: 100000, verify: "get-admin = K1; get-pending-admin = none (restored)" }

