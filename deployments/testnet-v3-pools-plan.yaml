# PLAN ONLY (Flashstack-ajv.6.9). Nothing in this file has been executed, and
# nothing may be broadcast under it until Matt has reviewed and approved it.
# The deploy script and the four receivers it names do not exist yet; they are
# listed in docs/TESTNET_STAGING.md section 6e as next steps for approval.
#
# THIS IS NOT A CLARINET DEPLOYMENT PLAN. Do not run it with
# `clarinet deployments apply` (same reason as testnet-pool-v3-plan.yaml:
# Clarinet publishes source verbatim, with mainnet principals still in it).
#
# Fees and nonce rules are NOT estimated. They are read off the scripts that
# have already run against testnet:
#   deploy fee 500000          deploy-testnet-pool-v3.mjs deployContract (fee: 500_000)
#   call fee 100000 (default)  deploy-testnet-pool-v3.mjs callContract (fee = 100_000)
#   deposit 150000             deploy-testnet-pool-v3.mjs step 7 override
#   flash-loan 200000          deploy-testnet-pool-v3.mjs step 9 override
#   STX transfer 10000         deploy-testnet.mjs transferStx (fee = 10_000)
#   sBTC transfer 100000       deploy-testnet-pool-v3.mjs step 8 override
# Any call with no override in either script (withdraw, arm, set-mode,
# seed-deposit, exit, rescue, set-paused, set-max-single-loan, the admin
# calls) uses the 100000 default. No new fee level is introduced.
#
# Amounts (loan sizes, deposits, seeds) are reused from the two executed runs
# where one exists (deploy-testnet.mjs for STX, deploy-testnet-pool-v3.mjs for
# sBTC). The one deliberate change is the sBTC deposit: 5000 sats instead of
# 10000, so the whole sBTC line fits the 9900 sats the deployer already holds
# (read live 2026-10-15) and needs no new manual sBTC transfer.

