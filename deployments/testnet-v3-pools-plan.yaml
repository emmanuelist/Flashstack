# ─────────────────────────────────────────────────────────────────────────────
# Stop / rollback (bead item 10)
# ─────────────────────────────────────────────────────────────────────────────
stop-rules:
  - Any step whose on-chain result differs from `expect` -> stop the run. If the pool is published, K1 calls set-paused true, then records the txid and the read-backs. Do not retry blind.
  - A publish that aborts consumes the contract NAME permanently at K1 (deployment scars, CONTRACT_INVENTORY.md §3). The fix ships under a new name (for example -v3b), and this plan is amended first.
  - An expected-failure step that SUCCEEDS (A18/A20/B18/B20 in particular) is a security finding, not a test glitch: pause, stop, report to the Security & Contract Lead before anything else.
  - If K1's sBTC balance reads below 6200 at preflight, stop before B1 (do not run line B partially).

evidence: {}   # filled from a run, every txid re-verified against /extended/v1/tx/0x<txid>
